id: guard

name: guard
synonyms: [sentry, sentinel, gatekeeper, watchman, soldier at the gate, cloak, them, they]

actions:
  - id: walk
    triggers:
      - type: response
        data:
          text: >-
            You walk up the road to the gate and stand at their shoulder. They do not turn. Up
            close there is coal smoke on the cloak and nothing else on it at all, and the chain
            across the road is at the height of a cart's axle and would stop nobody who meant it.

  - id: look
    triggers:
      - type: response
        data:
          text: >-
            A long black cloak, worn through at the cuffs, with plate armour underneath it
            that has been kept up better than the cloak has. A long blade is sheathed at
            their side and the whole length of it's rusted into the scabbard, and neither of
            you mentions this.
      - type: response
        data:
          text: >-
            They have stood at this gate long enough to have taken its shape. While you are
            looking at them they don't blink, and it takes you a moment to work out which of
            the things you've just seen was the odd one.
      - type: response
        data:
          text: >-
            Low on the left side, under the arm where the plate stops, there is a split in the
            steel about four inches across, driven inward. The cloak hangs into it. Nothing has
            ever been done about it, and their own blade is rusted into the scabbard, and both
            of those facts are the same fact.

  - id: ask
    triggers:
      - type: response
        data:
          text: >-
            "Ask, then," they say, still facing the road. "About the pass, if it's north you
            have got in mind."

  - id: ask
    preposition: for
    indirect: pass
    triggers:
      - type: response
        data:
          text: >-
            "I read them. I don't write them," they say. "And I've never once been told
            where they come from. Somebody in the tavern came down that road with one."

  - id: ask
    preposition: for
    triggers:
      - type: response
        data:
          text: >-
            "You would want to ask me about a thing rather than for it," they say. "I've
            nothing of my own here."

  - id: give
    indirect: pass
    triggers:
      - type: response
        data:
          text: >-
            They take it out of your hand and read all of it, both stamps and the figure in the
            CARRIED column, and hand it back. "That is in order," they say, and their hand goes
            to the chain and stops there. "Up you go, then, when you are ready for it."

  - id: give
    indirect: coins
    triggers:
      - type: response
        data:
          text: >-
            They look at the coin in your hand for slightly too long, and then away, back to
            the road. "No," they say. "That one is not mine and it's not for me. Keep hold of
            it."

  - id: give
    triggers:
      - type: response
        data:
          text: '"I''m on the gate," they say, which is a no.'

knows:
  - verb: tell
    topic: soldier
    requires:
      - type: flag
        data: { flag: soldier-sent }
    triggers:
      - type: response
        data:
          text: >-
            For the first time they turn all the way round and look at you properly. "Gone
            down, have they," they say. "Well. That is one off the road."
      - type: response
        data:
          text: >-
            They go back to the brazier and hold their hands out over it. "Four years that
            one stood there," they say, to the coals. "I could see them from here."

  - verb: tell
    triggers:
      - type: response
        data:
          text: '"You would have to know something I don''t," they say, "and nobody does."'

  - requires:
      - type: performed
        negate: true
        data: { object: guard, action: ask }
    triggers:
      - type: response
        data:
          text: >-
            "You'll not be going north," they say, without taking their eyes off the road.
            "Nobody goes up that road but the cart. A pass gets you through and nothing else
            does, and I'd not bother trying the woods."

  - topic: pass
    requires:
      - type: has-item
        data: { object: pass }
    triggers:
      - type: response
        data:
          text: '"Yours is in order," they say. "Go on up, then."'

  - topic: pass
    triggers:
      - type: response
        data:
          text: >-
            "Two stamps and a name and a figure in the last column," they say. "That is all I'm
            asked to see, and I see it maybe once a day."
      - type: response
        data:
          text: >-
            "The carter has one. it's in the tavern with the carter, and the carter is in the
            tavern with a glass they have not got the price of."
    knows:
      - topic: captain
        triggers:
          - type: response
            data:
              text: >-
                "Captain's orders, the road being shut," they say. "it's the phrase I was
                given." A pause, and their hand goes flat over the coals. "I could not tell you
                the name. I've said the word ten thousand times and there is nothing behind
                it."
        knows:
          - topic: soldier
            open: true
            triggers:
              - type: response
                data:
                  text: >-
                    "One of ours went up that road and never came down," they say. "March, it
                    was. They're still up there - fourth milestone, standing at it. I can see
                    them from this gate on a thinner day than this."
              - type: response
                data:
                  text: >-
                    "I'd not to leave the gate," they say, before you've asked. "And they're not
                    to come back down it. That is the whole of the arrangement and neither of us
                    made it."

  - topic: soldier
    triggers:
      - type: response
        data:
          text: >-
            "There's one up the road, if that's who you mean," they say. "Standing at the
            fourth milestone since March. Ask me about the pass and I'll tell you how you
            get to them."

  - topic: coins
    triggers:
      - type: response
        data:
          text: >-
            "There's money in that wall," they say, nodding west without looking. "There has
            always been money in that wall. It turns up under the stones for whoever is here
            and needs it, and I've stopped asking myself how."

  - topic: ferry
    triggers:
      - type: response
        data:
          text: >-
            "There's a boat at the end of that road," they say. "It goes over and it comes
            back empty. I've never seen it and I know it does."

  - topic: ferryman
    triggers:
      - type: response
        data:
          text: >-
            "Same cloak as this one," they say, and take a fold of their own between two
            fingers, and lets it drop. "Same as the carter's. We were all three given the
            cloak. Nobody said what for."

  - topic: river
    triggers:
      - type: response
        data:
          text: '"North, and wide, and not to be swum," they say. "Ask the carter. The carter goes."'

  - topic: carter
    triggers:
      - type: response
        data:
          text: >-
            "Comes down empty every day and goes up loaded," they say. "Or the other way about.
            I've watched that cart a thousand times and I could not tell you which."

  - topic: cart
    triggers:
      - type: response
        data:
          text: >-
            "It's lashed down under a cloth going up and it's not lashed down coming back,"
            they say. "I lift the chain. I don't look in the cart."

  - topic: barkeep
    triggers:
      - type: response
        data:
          text: '"Behind that counter as long as I''ve been at this gate," they say. "Longer, to hear them."'

  - topic: village
    triggers:
      - type: response
        data:
          text: >-
            "It's quiet and it keeps," they say. "Nobody is born here and nobody buries
            anybody, and if you had asked me that yesterday I'd have said the same thing
            and thought nothing of it."

  - topic: name
    triggers:
      - type: response
        data:
          text: >-
            "Mine?" They think about it, which takes a while. "Nobody has wanted it in a long
            time." They go back to the road. "I've not asked you yours either. it's not a
            thing that comes up."

  - topic: dead
    triggers:
      - type: response
        data:
          text: >-
            "That's a garrison matter," they say, in a voice that has closed, and it's the
            fastest they have said anything.

  - topic: price
    triggers:
      - type: response
        data:
          text: '"Nothing of mine is for sale," they say. "Least of all the road."'

  - topic: village.road
    triggers:
      - type: response
        data:
          text: '"North and south," they say. "One of them is shut, and you know which."'

  - topic: village-fog
    triggers:
      - type: response
        data:
          text: >-
            They look up at it, briefly, the way you look at a ceiling. "It's been like that
            since I came up," they say. "I couldn't tell you what it was like before, and I've
            only just noticed that."

  - topic: brazier
    triggers:
      - type: response
        data:
          text: '"Coal off the carts," they say. "Nobody has ever once asked me not to."'

  - topic: gate
    triggers:
      - type: response
        data:
          text: '"It''s a chain at axle height," they say. "Standing at it''s the job. The chain is not the job."'

  - topic: stones
    triggers:
      - type: response
        data:
          text: >-
            "The wall came down the winter before I came up," they say. "Nobody has missed it
            and nobody has moved a stone of it but you."

  - topic: tavern
    triggers:
      - type: response
        data:
          text: >-
            '"I'd on duty," they say, in the voice of somebody who has been asked that before.'

  - triggers:
      - type: response
        data:
          text: They shrug, and go back to watching the road.

name: Publish

# One program per platform, each with the engine inside it.
#
# This used to build a single `.stg` and publish that: ninety kilobytes of game that any
# machine with a Stage on it could play. A game carries its own engine now, so what is
# published is five programs, and a player needs no Stage at all.
#
# **One runner makes all five**, which is worth saying because it looks as though it
# should not. `stage export` writes the game into a copy of Stage rather than compiling
# anything, so the only thing it needs for a platform is that platform's published Stage,
# handed over with `--templates`. No cross-compiler is involved.
#
# **It has to be a Mac**, though. An Intel Mac program is signed by asking the platform,
# and only a Mac can be asked, so the engine leaves that one out rather than writing a
# program nobody should be handed. Apple Silicon signs in pure Rust and needs no help.
#
# **The store's rows are not written here**, and were once. A release page is public and
# is for players; the statements that put a build in the shop are the app's own table
# names and listing ids, which is nothing secret and nothing a player should be reading.
# They are generated from this release instead, by `deno task rows` in the app, which
# reads the assets and hashes what it actually downloads.
#
# **`STAGE` has to be a release that can actually export this game.** A template and the
# Stage doing the exporting must be the same version - the engine refuses a mismatch
# rather than writing a game into a Stage that might read it differently - so this is the
# one value to bump when the engine releases.

on:
  push:
    tags: ['v*']

  workflow_dispatch:
    inputs:
      tag:
        description: The tag to build and release.
        required: true
      engine:
        description: Which Stage to build with.
        required: false

permissions:
  contents: write

env:
  STAGE: ${{ inputs.engine || '0.16.1' }}

jobs:
  publish:
    # Not `ubuntu-latest`, and the reason is above: an Intel Mac build can only be signed
    # on a Mac, and a runner that could make four of the five would publish a game that is
    # missing one platform without saying so.
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      # Every published Stage, and the list of sums published beside them. `export` reads
      # both: the sums are what tell it a download arrived whole and came from the release
      # it claims to, which matters more than usual here because a game is about to be
      # written into each one and handed to somebody.
      - name: Fetch the Stages to write into
        run: |
          set -euo pipefail

          mkdir -p templates

          for asset in \
            checksums.txt \
            stage-macos-arm64 \
            stage-macos-x86_64 \
            stage-linux-arm64 \
            stage-linux-x86_64 \
            stage-windows-x86_64.exe
          do
            curl -fsSL -o "templates/$asset" \
              "https://engine.sgail.com/download/engine@${STAGE}/$asset"
          done

          chmod +x templates/stage-macos-arm64

          # The one this runner can actually execute, which is also the one that does the
          # exporting. Its own version has to match the templates', which is the whole
          # reason there is a single `STAGE` above rather than one per asset.
          cp templates/stage-macos-arm64 stage

          ./stage --version

      - name: Build the game
        run: |
          set -euo pipefail

          ./stage compile . --output game.stg --strict

      - name: Read what was built
        id: built
        run: |
          set -euo pipefail

          python3 - <<'PY' >> "$GITHUB_OUTPUT"

          import gzip, json

          # Format 2 is the magic, a format byte, the compressed part's length as eight bytes
          # least significant first, then the part, then every file the game carries, raw.
          # Only the part is read: the files after it are the game's sounds and pictures.
          with open('game.stg', 'rb') as stg:
              if stg.read(4) != b'STG\x00':
                  raise SystemExit('game.stg does not begin like a Stage game')

              format = stg.read(1)[0]

              if format != 2:
                  raise SystemExit(f'game.stg is format {format}, and this reads format 2')

              length = int.from_bytes(stg.read(8), 'little')
              built = json.loads(gzip.decompress(stg.read(length)))
          about = built['game'].get('metadata') or {}

          for name, value in (
              ('id', built['game']['id']),
              ('title', about.get('title', '')),
              ('version', about.get('version', '')),
              ('engine', built.get('engine', '')),
          ):
              print(f'{name}={value}')
          PY

      - name: Check the tag against the game
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
          VERSION: ${{ steps.built.outputs.version }}
        run: |
          set -euo pipefail

          if [ "${TAG#v}" != "$VERSION" ]; then
            echo "::error::tag $TAG does not match the version in the game ($VERSION)."
            echo "Set metadata.version in config.yaml, or tag v$VERSION."
            exit 1
          fi

      - name: Export a program for every platform
        run: |
          set -euo pipefail

          ./stage export game.stg --output exports --templates templates

      # A macOS game is a bundle, which is a directory, and an address serves one file.
      # Zipped with `ditto` rather than `zip`, because a bundle carries resource forks and
      # an extended attribute saying it is signed, and `zip` drops both - what comes out
      # the other end would be a bundle macOS refuses to open.
      #
      # Everything else is already one file and is left alone.
      - name: Name every program for the release
        env:
          ID: ${{ steps.built.outputs.id }}
          VERSION: ${{ steps.built.outputs.version }}
        run: |
          set -euo pipefail

          mkdir -p release

          for platform in exports/*/; do
            name="$(basename "$platform")"

            app="$(find "$platform" -maxdepth 1 -name '*.app' -print -quit)"

            if [ -n "$app" ]; then
              ditto -c -k --sequesterRsrc --keepParent "$app" "release/${ID}-${VERSION}-${name}.zip"
              continue
            fi

            program="$(find "$platform" -maxdepth 1 -type f -print -quit)"
            suffix=''

            case "$name" in
              windows-*) suffix='.exe' ;;
            esac

            cp "$program" "release/${ID}-${VERSION}-${name}${suffix}"
          done

          cd release && shasum -a 256 * > checksums.txt

          ls -la

      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
          TITLE: ${{ steps.built.outputs.title }}
          VERSION: ${{ steps.built.outputs.version }}
          ENGINE: ${{ steps.built.outputs.engine }}
        run: |
          set -euo pipefail

          {
            echo "\`$TITLE\` $VERSION, carrying Stage $ENGINE."
            echo
            echo 'One program per platform, each with the engine inside it. Nothing to install:'
            echo 'download the one for your machine and open it.'
            echo
            echo 'The macOS downloads are zipped because an application is a folder. Everything'
            echo 'else is the program itself.'
          } > notes.md

          gh release create "$TAG" \
            --title "$TITLE $VERSION" \
            --notes-file notes.md \
            release/*
